<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A quiet weekly collection of engineering writing worth reading." />
  <title>Engineering Weekly</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#">Engineering Weekly</a>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">◐</button>
  </header>

  <main class="page-shell">
    <div class="content-column">
      <section class="intro">
        <p class="eyebrow">CURATED ENGINEERING READING</p>
        <h1>A few good articles.<br>Every week.</h1>
        <p class="lede">Selected writing on AI, infrastructure, distributed systems, databases, and the craft of building software.</p>
      </section>

      <section class="week">
        <div class="section-heading">
          <div>
            <p id="week-eyebrow" class="eyebrow">THIS WEEK</p>
            <h2 id="week-title">Loading…</h2>
          </div>
          <p id="week-note" class="week-note"></p>
        </div>
        <div id="current-articles" class="article-list"></div>
      </section>
    </div>

    <aside class="sidebar">
      <p class="eyebrow">PREVIOUS WEEKS</p>
      <nav id="archive-list" class="archive-list" aria-label="Previous weeks"></nav>
    </aside>
  </main>

  <footer><p>Built for slow reading and better engineering intuition.</p></footer>
  <script src="script.js?v=3"></script>
</body>
</html>
